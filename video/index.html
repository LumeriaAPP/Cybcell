<!doctype html>
<html lang="az">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CybCell launch film</title>
    <style>
      @font-face {
        font-family: 'Geist';
        src: url('fonts/Geist-Medium.woff2') format('woff2');
        font-weight: 500;
      }
      @font-face {
        font-family: 'Geist';
        src: url('fonts/Geist-SemiBold.woff2') format('woff2');
        font-weight: 600;
      }
      @font-face {
        font-family: 'Geist Mono';
        src: url('fonts/GeistMono-Regular.woff2') format('woff2');
        font-weight: 400;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: min(100vw, 177.78vh);
        height: min(56.25vw, 100vh);
        margin: auto;
        position: absolute;
        inset: 0;
      }
      body.render canvas {
        width: 1920px;
        height: 1080px;
        position: static;
      }
    </style>
  </head>
  <body>
    <canvas id="film" width="1920" height="1080"></canvas>
    <script type="module">
      /*
       * CybCell: 30-second launch film, trailer cut.
       * Everything on screen is built from one population of particles
       * ("cells") that morph from formation to formation. Every frame is a
       * pure function of time, so window.seek(t) renders frame-exact.
       * Scene times and impact points live in timeline.json, shared with
       * tools/sound.py so picture and sound hit together.
       */
      const W = 1920;
      const H = 1080;
      const N = 7000;
      const CX = 960;
      const CY = 470;
      const TAU = Math.PI * 2;
      const BAR = Math.round((H - W / 2.39) / 2); // 2.39:1 letterbox
      const BASE = 0.82; // formations are drawn at this scale to sit inside the letterbox
      let T;
      let DUR = 30;

      const cv = document.getElementById('film');
      const ctx = cv.getContext('2d');

      const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
      const lerp = (a, b, t) => a + (b - a) * t;
      const smooth = (a, b, x) => {
        const t = clamp((x - a) / (b - a));
        return t * t * (3 - 2 * t);
      };
      const eio = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
      const eioD = (t) => (t < 0.5 ? 12 * t * t : 3 * Math.pow(-2 * t + 2, 2));
      const eoExpo = (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t));
      const EASE = {
        io: [eio, eioD],
        expo: [eoExpo, (g) => (g >= 1 ? 0 : 10 * Math.LN2 * Math.pow(2, -10 * g))],
        in: [(g) => g * g * g, (g) => 3 * g * g],
      };
      const hash = (n) => {
        const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
      };

      // Per-particle constants.
      const R1 = new Float32Array(N);
      const R2 = new Float32Array(N);
      const R3 = new Float32Array(N);
      const R4 = new Float32Array(N);
      for (let i = 0; i < N; i++) {
        R1[i] = hash(i * 4 + 1);
        R2[i] = hash(i * 4 + 2);
        R3[i] = hash(i * 4 + 3);
        R4[i] = hash(i * 4 + 4);
      }

      // x, y, alpha, size, colour (0 white, 1 threat red) and heat (0 white .. 1 ember).
      const buf = () => ({
        x: new Float32Array(N),
        y: new Float32Array(N),
        a: new Float32Array(N),
        s: new Float32Array(N),
        c: new Uint8Array(N),
        h: new Float32Array(N),
      });

      /* ------------------------------------------------------ shape builder */

      /** Builds a static point set from primitives, then resamples it to exactly N. */
      function shape(build) {
        const pts = [];
        let seed = 1;
        const push = (x, y, b, s, g) => pts.push([x, y, b, s, g]);
        const api = {
          poly(p, closed, gap, b = 0.8, s = 1.5, g = 0) {
            const n = p.length;
            const segs = closed ? n : n - 1;
            for (let i = 0; i < segs; i++) {
              const [x0, y0] = p[i];
              const [x1, y1] = p[(i + 1) % n];
              const m = Math.max(1, Math.round(Math.hypot(x1 - x0, y1 - y0) / gap));
              for (let j = 0; j < m; j++) {
                const f = j / m;
                seed++;
                push(x0 + (x1 - x0) * f + (hash(seed) - 0.5) * 1.6, y0 + (y1 - y0) * f + (hash(seed + 7) - 0.5) * 1.6, b * (0.75 + 0.25 * hash(seed + 3)), s, g);
              }
            }
          },
          line(x0, y0, x1, y1, gap, b, s, g) {
            api.poly([[x0, y0], [x1, y1]], false, gap, b, s, g);
          },
          rr(x, y, w, h, r) {
            r = Math.min(r, w / 2, h / 2);
            const p = [];
            for (const [cx, cy, a0] of [[x + w - r, y + r, -Math.PI / 2], [x + w - r, y + h - r, 0], [x + r, y + h - r, Math.PI / 2], [x + r, y + r, Math.PI]])
              for (let k = 0; k <= 6; k++) p.push([cx + Math.cos(a0 + (k / 6) * (Math.PI / 2)) * r, cy + Math.sin(a0 + (k / 6) * (Math.PI / 2)) * r]);
            return p;
          },
          rect(x, y, w, h, r, gap, b, s, g) {
            api.poly(api.rr(x, y, w, h, r), true, gap, b, s, g);
          },
          ring(cx, cy, r, gap, b, s, g, ry = r) {
            const p = [];
            for (let k = 0; k < 48; k++) p.push([cx + Math.cos((k / 48) * TAU) * r, cy + Math.sin((k / 48) * TAU) * ry]);
            api.poly(p, true, gap, b, s, g);
          },
          fill(x, y, w, h, gap, b, s, keep, g) {
            for (let yy = y + gap / 2; yy < y + h; yy += gap)
              for (let xx = x + gap / 2; xx < x + w; xx += gap) {
                seed++;
                if (hash(seed) > keep) continue;
                push(xx + (hash(seed + 1) - 0.5) * gap * 0.6, yy + (hash(seed + 2) - 0.5) * gap * 0.6, b * (0.6 + 0.4 * hash(seed + 5)), s, g);
              }
          },
          pt: push,
        };
        build(api);
        const M = pts.length;
        const o = { x: new Float32Array(N), y: new Float32Array(N), b: new Float32Array(N), s: new Float32Array(N), g: new Uint8Array(N) };
        for (let i = 0; i < N; i++) {
          // Keep the build order so outline maps to outline between shapes.
          const k = Math.min(M - 1, Math.floor((i * M) / N));
          const p = pts[k];
          const dup = M < N ? 1 : 0;
          o.x[i] = p[0] + dup * (R1[i] - 0.5) * 2.2;
          o.y[i] = p[1] + dup * (R2[i] - 0.5) * 2.2;
          o.b[i] = p[2];
          o.s[i] = p[3];
          o.g[i] = p[4];
        }
        return o;
      }

      const fromShape = (sh, i, o, dx = 0, dy = 0, am = 1) => {
        o.x[i] = sh.x[i] + dx;
        o.y[i] = sh.y[i] + dy;
        o.a[i] = sh.b[i] * am;
        o.s[i] = sh.s[i];
        o.c[i] = 0;
        o.h[i] = 0;
      };

      /* ------------------------------------------------------- formations */

      // 0. Darkness, then a single point of light that gathers energy.
      function POINT(t, o) {
        const p = smooth(T.point, T.hit - 0.12, t);
        const inhale = 1 - 0.6 * smooth(T.silence[0][0], T.hit, t);
        const flick = 0.85 + 0.15 * Math.sin(t * 37) * Math.sin(t * 23);
        for (let i = 0; i < N; i++) {
          const a = R1[i] * TAU;
          const r = Math.pow(R2[i], 2.2) * (1.5 + 9 * p * p) * inhale;
          o.x[i] = CX + Math.cos(a) * r;
          o.y[i] = CY + Math.sin(a) * r;
          o.a[i] = i % 7 === 0 ? p * 0.85 * flick : 0;
          o.s[i] = i % 49 === 0 ? 1.8 : 1.3;
          o.c[i] = 0;
          o.h[i] = 0.55 * p;
        }
      }

      // 1. The first cell, burning like a young star: a boiling surface,
      // loops of matter at the limb and dust streaming away.
      const EMBER_R = 235;
      function EMBER(t, o) {
        const rc = EMBER_R;
        const ay = t * 0.18;
        const cy = Math.cos(ay);
        const sy = Math.sin(ay);
        const cax = Math.cos(0.3);
        const sax = Math.sin(0.3);
        for (let i = 0; i < N; i++) {
          const r1 = R1[i];
          o.c[i] = 0;
          o.h[i] = 1;
          if (r1 < 0.8) {
            const u = R2[i] * 2 - 1;
            const ph = R3[i] * TAU;
            const q = Math.sqrt(1 - u * u);
            const shell = r1 < 0.66;
            const rad = shell ? 1 + 0.035 * Math.sin(ph * 6 + u * 9 + t * 1.9) * Math.sin(u * 11 - t * 1.4 + ph * 4) : Math.cbrt(R4[i]) * 0.92;
            const x = Math.cos(ph) * q * rad;
            const y = u * rad;
            const z = Math.sin(ph) * q * rad;
            const x1 = x * cy - z * sy;
            const z1 = x * sy + z * cy;
            const y2 = y * cax - z1 * sax;
            const z2 = y * sax + z1 * cax;
            const d = (z2 + 1) / 2;
            o.x[i] = CX + x1 * rc;
            o.y[i] = CY + y2 * rc;
            o.a[i] = shell ? (0.1 + 0.9 * d * d) * (0.8 + 0.2 * Math.sin(t * 5 + i * 1.7)) : 0.18 + 0.3 * d;
            o.s[i] = 1.35 * (0.7 + 0.6 * d);
          } else if (r1 < 0.92) {
            // Prominences: arcs of matter lifting off the limb.
            const loop = Math.floor(R2[i] * 3);
            const base = [5.55, 2.85, 1.05][loop] + t * 0.04;
            const span = [0.13, 0.08, 0.06][loop];
            const s = R3[i];
            const ang = base + (s - 0.5) * span * 2;
            const hgt = [0.11, 0.07, 0.045][loop] * (0.75 + 0.25 * Math.sin(t * 0.8 + loop * 2)) * Math.sin(Math.PI * s);
            const rr = rc * (1 + hgt) + (R4[i] - 0.5) * 6;
            o.x[i] = CX + Math.cos(ang) * rr;
            o.y[i] = CY + Math.sin(ang) * rr;
            o.a[i] = 0.3 + 0.5 * Math.sin(Math.PI * s);
            o.s[i] = 1.1;
          } else {
            // Corona dust streaming outward.
            const life = (t * 0.12 + R4[i]) % 1;
            const rr = rc * (1.02 + life * 0.95);
            const ang = R2[i] * TAU + life * 0.3;
            o.x[i] = CX + Math.cos(ang) * rr;
            o.y[i] = CY + Math.sin(ang) * rr;
            o.a[i] = (1 - life) * 0.4;
            o.s[i] = 1;
          }
        }
      }

      // 2. Cells: k stardust spheres. Particle i belongs to cell i mod k, so a
      // cell's particles split evenly into its two children when k doubles.
      // They cool from ember to white as they multiply.
      function vogel(k) {
        const pts = [];
        for (let c = 0; c < k; c++) {
          const r = Math.sqrt(c + 0.5);
          const a = c * 2.39996;
          pts.push([Math.cos(a) * r, Math.sin(a) * r]);
        }
        const mx = pts.reduce((s, p) => s + p[0], 0) / k;
        const my = pts.reduce((s, p) => s + p[1], 0) / k;
        return pts.map(([x, y]) => [x - mx, y - my]);
      }
      const VOGEL = {};
      function CELLS(k) {
        VOGEL[k] = vogel(k);
        return (t, o) => {
          const rc = 175 * Math.pow(k, -0.47);
          const sp = rc * 2.35;
          const V = VOGEL[k];
          const heat = 1 - smooth(T.div[0] + 0.2, T.div[3] + 0.9, t);
          for (let i = 0; i < N; i++) {
            const c = i % k;
            const u = R2[i] * 2 - 1;
            const ph = R3[i] * TAU;
            const q = Math.sqrt(1 - u * u);
            let rad;
            let role;
            if (R1[i] < 0.6) {
              rad = 1 - R4[i] * 0.04;
              role = 0;
            } else if (R1[i] < 0.82) {
              rad = Math.cbrt(R4[i]) * 0.34;
              role = 2;
            } else {
              rad = 0.38 + Math.cbrt(R4[i]) * 0.52;
              role = 1;
            }
            const breath = 1 + 0.025 * Math.sin(t * 2.1 + c * 1.7);
            let x = Math.cos(ph) * q * rad;
            let y = u * rad;
            let z = Math.sin(ph) * q * rad;
            const ay = t * 0.45;
            const cy = Math.cos(ay);
            const sy = Math.sin(ay);
            const x1 = x * cy - z * sy;
            const z1 = x * sy + z * cy;
            const ax = 0.35;
            const y2 = y * Math.cos(ax) - z1 * Math.sin(ax);
            const z2 = y * Math.sin(ax) + z1 * Math.cos(ax);
            const d = (z2 + 1) / 2;
            o.x[i] = CX + V[c][0] * sp + x1 * rc * breath;
            o.y[i] = CY + V[c][1] * sp + y2 * rc * breath;
            o.a[i] = role === 0 ? 0.12 + 0.85 * d * d : role === 2 ? 0.45 + 0.55 * d : 0.1 + 0.35 * d;
            o.s[i] = (role === 2 ? 1.3 : 1.35) * (0.7 + 0.6 * d) * clamp(0.75 + rc / 400, 0.8, 1.2);
            o.c[i] = 0;
            o.h[i] = heat;
          }
        };
      }

      // 3. Website: a browser window with a page inside.
      let WEB_SH;
      function buildWeb() {
        WEB_SH = shape((s) => {
          s.rect(460, 160, 1000, 620, 22, 3, 0.9, 1.6, 0);
          s.line(460, 212, 1460, 212, 4, 0.5, 1.2, 0);
          for (let k = 0; k < 3; k++) s.ring(492 + k * 24, 186, 7, 2.2, 0.9, 1.4, 0);
          s.rect(760, 174, 400, 24, 12, 4, 0.35, 1.1, 0);
          s.fill(500, 236, 920, 40, 7, 0.22, 1.1, 0.5, 0);
          s.ring(522, 256, 10, 2.2, 0.9, 1.4, 0);
          for (let k = 0; k < 3; k++) s.line(1240 + k * 60, 256, 1280 + k * 60, 256, 3, 0.6, 1.2, 0);
          s.line(500, 322, 1000, 322, 2.4, 1, 2.4, 0);
          s.line(500, 360, 900, 360, 2.6, 0.55, 1.4, 0);
          s.line(500, 392, 780, 392, 2.6, 0.45, 1.4, 0);
          s.fill(500, 432, 170, 48, 4, 0.8, 1.3, 0.85, 1);
          s.rect(500, 432, 170, 48, 24, 2.6, 1, 1.5, 1);
          s.rect(1060, 300, 360, 250, 10, 3, 0.6, 1.3, 0);
          s.poly([[1080, 530], [1170, 420], [1230, 490], [1290, 440], [1400, 530]], false, 3, 0.55, 1.2, 0);
          s.ring(1350, 352, 22, 2.4, 0.7, 1.3, 0);
          for (let k = 0; k < 3; k++) {
            const x = 500 + k * 310;
            s.rect(x, 600, 290, 150, 12, 3.5, 0.5, 1.2, 0);
            s.line(x + 24, 640, x + 200, 640, 3, 0.65, 1.3, 0);
            s.line(x + 24, 672, x + 150, 672, 3, 0.38, 1.1, 0);
          }
          // Cursor (group 2) and click ripple (group 3).
          s.poly([[0, 0], [0, 36], [9, 27], [16, 42], [22, 39], [15, 25], [27, 25]], true, 1.8, 1, 1.6, 2);
          s.ring(0, 0, 1, 1, 1, 1.4, 3);
        });
      }
      function WEB(t, o) {
        const lt = t - T.web;
        const mv = eio(smooth(0.4, 0.95, lt));
        const cx = lerp(1290, 590, mv);
        const cy = lerp(700, 462, mv);
        const click = clamp((lt - 1.0) / 0.45);
        for (let i = 0; i < N; i++) {
          const g = WEB_SH.g[i];
          if (g === 2) fromShape(WEB_SH, i, o, cx, cy, lt > 1.35 ? 1 - smooth(1.35, 1.55, lt) : 1);
          else if (g === 3) {
            const a = R1[i] * TAU;
            const r = 12 + click * 70;
            o.x[i] = 585 + Math.cos(a) * r;
            o.y[i] = 456 + Math.sin(a) * r * 0.6;
            o.a[i] = click > 0 && click < 1 ? (1 - click) * 0.9 : 0;
            o.s[i] = 1.5;
            o.c[i] = 0;
            o.h[i] = 0;
          } else fromShape(WEB_SH, i, o, 0, 0, g === 1 ? 0.8 + 0.2 * Math.sin(t * 5) + (click > 0 && click < 1 ? 0.5 * (1 - click) : 0) : 1);
        }
      }

      // 4. Phone app: live list, a notification drops in.
      let APP_SH;
      function buildApp() {
        APP_SH = shape((s) => {
          s.rect(780, 110, 360, 720, 54, 2.8, 0.95, 1.7, 0);
          s.rect(795, 125, 330, 690, 42, 5, 0.22, 1.1, 0);
          s.line(925, 140, 995, 140, 2, 1, 2.4, 0);
          s.line(910, 812, 1010, 812, 2, 0.8, 1.8, 0);
          s.line(810, 172, 880, 172, 2.4, 0.9, 1.8, 0);
          s.ring(1105, 172, 12, 2.2, 0.8, 1.3, 0);
          for (let j = 0; j < 6; j++) {
            const y = 205 + j * 116;
            s.rect(810, y, 300, 98, 16, 3.4, 0.5, 1.2, 4);
            s.ring(846, y + 49, 18, 2.2, 0.75, 1.3, 4);
            s.line(876, y + 38, 1080, y + 38, 3, 0.6, 1.3, 4);
            s.line(876, y + 62, 1010, y + 62, 3, 0.35, 1.1, 4);
          }
          s.fill(806, 0, 308, 70, 4, 0.7, 1.3, 0.8, 5);
          s.rect(806, 0, 308, 70, 18, 2.4, 1, 1.6, 5);
          s.ring(838, 35, 13, 2, 1, 1.5, 5);
          s.line(862, 26, 1060, 26, 2.4, 1, 1.8, 5);
          s.line(862, 46, 990, 46, 2.6, 0.6, 1.3, 5);
        });
      }
      function APP(t, o) {
        const lt = t - T.app;
        const scroll = lt * 55;
        const drop = eoExpo(clamp((lt - 0.45) / 0.5));
        for (let i = 0; i < N; i++) {
          const g = APP_SH.g[i];
          if (g === 4) {
            let y = APP_SH.y[i] - 205 - scroll;
            y = ((y % 696) + 696) % 696;
            const yy = 205 + y;
            const edge = smooth(200, 240, yy) * (1 - smooth(760, 800, yy));
            fromShape(APP_SH, i, o, 0, yy - APP_SH.y[i], edge);
          } else if (g === 5) fromShape(APP_SH, i, o, 0, lerp(40, 130, drop), drop);
          else fromShape(APP_SH, i, o);
        }
      }

      // 5. AI: a network with pulses racing from input to output.
      const LAYERS = [4, 6, 6, 4];
      const LX = [600, 840, 1080, 1320];
      const nodeY = (l, j) => CY + (j - (LAYERS[l] - 1) / 2) * 104;
      const CONNS = [];
      for (let l = 0; l < 3; l++) for (let a = 0; a < LAYERS[l]; a++) for (let b = 0; b < LAYERS[l + 1]; b++) CONNS.push([l, a, b]);
      function AI(t, o) {
        const nodes = [];
        LAYERS.forEach((n, l) => {
          for (let j = 0; j < n; j++) nodes.push([LX[l], nodeY(l, j)]);
        });
        for (let i = 0; i < N; i++) {
          const r = R1[i];
          o.c[i] = 0;
          o.h[i] = 0;
          if (r < 0.24) {
            // Nodes: small rotating spheres.
            const nd = nodes[i % nodes.length];
            const u = R2[i] * 2 - 1;
            const ph = R3[i] * TAU + t * 0.9;
            const q = Math.sqrt(1 - u * u);
            const rad = R4[i] < 0.7 ? 26 : 26 * Math.cbrt(R4[i]) * 0.5;
            const d = (Math.sin(ph) * q + 1) / 2;
            o.x[i] = nd[0] + Math.cos(ph) * q * rad;
            o.y[i] = nd[1] + u * rad;
            o.a[i] = R4[i] < 0.7 ? 0.2 + 0.8 * d : 0.9;
            o.s[i] = 1.4;
          } else if (r < 0.8) {
            // Connections: dotted lines.
            const cn = CONNS[Math.floor(R2[i] * CONNS.length)];
            const f = R3[i];
            const x0 = LX[cn[0]];
            const y0 = nodeY(cn[0], cn[1]);
            const x1 = LX[cn[0] + 1];
            const y1 = nodeY(cn[0] + 1, cn[2]);
            o.x[i] = lerp(x0, x1, f);
            o.y[i] = lerp(y0, y1, f);
            o.a[i] = 0.1 + 0.08 * Math.sin(t * 2 + i);
            o.s[i] = 1;
          } else if (r < 0.92) {
            // Pulses: a path through all four layers.
            const path = [0, 1, 2, 3].map((l) => Math.floor(hash(i * 13 + l) * LAYERS[l]));
            const u = (t * 0.85 + R2[i]) % 1;
            const seg = Math.min(2, Math.floor(u * 3));
            const f = u * 3 - seg;
            const lag = R3[i] * 0.06;
            const ff = clamp(f - lag);
            o.x[i] = lerp(LX[seg], LX[seg + 1], ff);
            o.y[i] = lerp(nodeY(seg, path[seg]), nodeY(seg + 1, path[seg + 1]), ff);
            o.a[i] = lag < 0.01 ? 1 : 0.7 - lag * 8;
            o.s[i] = lag < 0.01 ? 2.4 : 1.4;
          } else {
            // Data streaming in (left) and answers leaving (right).
            const side = R2[i] < 0.5;
            const u = (t * 0.35 + R3[i]) % 1;
            const lane = Math.floor(R4[i] * 4);
            if (side) {
              o.x[i] = lerp(300, LX[0] - 34, u);
              o.y[i] = nodeY(0, lane) + Math.sin(u * 9 + i) * 3;
            } else {

            o.h[i] = clamp((WORD.edge[i] ? rim : 0) + band * 0.9);
          } else {
            o.x[i] = WORD.x[i] + Math.sin(t * 0.2 + i) * 8;
            o.y[i] = WORD.y[i] + Math.cos(t * 0.2 + i) * 5;
            o.a[i] = 0.06 + 0.18 * R4[i];
            o.s[i] = 0.9;
            o.h[i] = 0;
          }
        }
      }

      /* --------------------------------------------------------- timeline */

      let SEG;
      function buildTimeline() {
        SEG = [
          { t0: 0, f: POINT },
          { t0: T.hit, f: EMBER, blend: 0.9, ease: 'expo', swirl: 40, cap: 70 },
          { t0: T.div[0], f: CELLS(2), blend: 0.42, swirl: 30 },
          { t0: T.div[1], f: CELLS(4), blend: 0.42, swirl: 30 },
          { t0: T.div[2], f: CELLS(8), blend: 0.42, swirl: 30 },
          { t0: T.div[3], f: CELLS(16), blend: 0.45, swirl: 30 },
          { t0: T.web, f: WEB, blend: 0.75, swirl: 120, burst: 150, ease: 'expo', cap: 60 },
          { t0: T.app, f: APP, blend: 0.6, swirl: 60, burst: 70 },
          { t0: T.ai, f: AI, blend: 0.7, swirl: 120, burst: 130, ease: 'expo', cap: 60 },
          { t0: T.tower, f: TOWERF, blend: 0.7, swirl: 100, burst: 110, delay: () => TOWER.delay },
          { t0: T.chart, f: CHART, blend: 0.7, swirl: 100, burst: 110, delay: () => CHART_SH.delay },
          { t0: T.kiosk, f: KIOSK, blend: 0.7, swirl: 110, burst: 110, ease: 'expo', cap: 60 },
          { t0: T.shield, f: SHIELD, blend: 0.65, swirl: 100, burst: 110, delay: () => SHIELD_SH.delay, zoom: 0.86 },
          { t0: T.dark, f: DUST, blend: 1.0, swirl: 200 },
          { t0: T.galaxy, f: GALAXY, blend: 1.1, swirl: 280 },
          { t0: T.collapse, f: COLLAPSE, blend: 0.4, ease: 'in', swirl: 260, cap: 80 },
          { t0: T.logo, f: WORDF, blend: 0.9, ease: 'expo', burst: 90, cap: 80, delay: () => WORD.delay, maxDelay: 0.2 },
        ];
      }

      const A = buf();
      const B = buf();
      const OUT = buf();
      const STREAK = new Float32Array(N * 2);

      function compose(t) {
        let k = 0;
        for (let i = 0; i < SEG.length; i++) if (SEG[i].t0 <= t) k = i;
        const seg = SEG[k];
        const blend = seg.blend || 0;
        const delays = seg.delay ? seg.delay() : null;
        const maxDelay = delays ? seg.maxDelay || 1.6 : 0;
        const inTransition = k > 0 && t < seg.t0 + blend * 1.3 + maxDelay;
        seg.f(t, B);
        if (!inTransition) {
          OUT.x.set(B.x);
          OUT.y.set(B.y);
          OUT.a.set(B.a);
          OUT.s.set(B.s);
          OUT.c.set(B.c);
          OUT.h.set(B.h);
          STREAK.fill(0);
          return k;
        }
        SEG[k - 1].f(t, A);
        const [ef, ed] = EASE[seg.ease || 'io'];
        const sw = seg.swirl || 0;
        const burst = seg.burst || 0;
        const cap = seg.cap || 34;
        for (let i = 0; i < N; i++) {
          const st = R4[i] * blend * 0.3 + (delays ? delays[i] : 0);
          const g = clamp((t - seg.t0 - st) / blend);
          const e = ef(g);
          const dx = B.x[i] - A.x[i];
          const dy = B.y[i] - A.y[i];
          const len = Math.hypot(dx, dy) || 1;
          const arc = Math.sin(Math.PI * e) * sw * (R1[i] - 0.5) * 2;
          let x = A.x[i] + dx * e + (-dy / len) * arc;
          let y = A.y[i] + dy * e + (dx / len) * arc;
          if (burst) {
            // Blast outward from the centre mid-flight, then settle.
            const bx = x - CX;
            const by = y - CY;
            const bl = Math.hypot(bx, by) || 1;
            const b = Math.sin(Math.PI * e) * burst * (0.4 + R2[i]);
            x += (bx / bl) * b;
            y += (by / bl) * b;
          }
          OUT.x[i] = x;
          OUT.y[i] = y;
          const mid = Math.sin(Math.PI * g) * 0.25;
          OUT.a[i] = lerp(A.a[i], B.a[i], e) + mid * Math.max(A.a[i], B.a[i]);
          OUT.s[i] = lerp(A.s[i], B.s[i], e);
          OUT.c[i] = e < 0.5 ? A.c[i] : B.c[i];
          OUT.h[i] = lerp(A.h[i], B.h[i], e);
          // Motion streak: direction of travel, length from speed.
          const v = (ed(g) / blend) * (1 / 60) * 1.6;
          let sxv = dx * v;
          let syv = dy * v;
          const sl = Math.hypot(sxv, syv);
          if (sl > cap) {
            sxv *= cap / sl;
            syv *= cap / sl;
          }
          STREAK[i * 2] = sxv;
          STREAK[i * 2 + 1] = syv;
        }
        return k;
      }

      /* ---------------------------------------------------------- captions */

      let CAPS;
      function buildCaptions() {
        CAPS = [
          { t0: T.hit + 0.45, t1: T.div[0] - 0.25, text: 'HƏR ŞEY BİR HÜCEYRƏDƏN BAŞLAYIR.' },
          { t0: T.div[0] + 0.25, t1: T.web - 0.5, text: 'BİZ BİZNESİNİZİN RƏQƏMSAL HÜCEYRƏLƏRİNİ QURURUQ.' },
          { t0: T.web + 0.25, t1: T.ai - 0.2, label: '01 / 06   SAYT VƏ TƏTBİQ', text: 'SAYTLAR VƏ MOBİL TƏTBİQLƏR.' },
          { t0: T.ai + 0.25, t1: T.tower - 0.2, label: '02 / 06   SÜNİ İNTELLEKT', text: 'SÜNİ İNTELLEKT İNTEQRASİYASI.' },
          { t0: T.tower + 0.25, t1: T.chart - 0.2, label: '03 / 06   3D VƏ AR', text: 'BİNA TİKİLMƏMİŞ SATILIR.' },
          { t0: T.chart + 0.25, t1: T.kiosk - 0.2, label: '04 / 06   MARKETİNQ', text: 'DİQQƏTİ SATIŞA ÇEVİRİRİK.' },
          { t0: T.kiosk + 0.25, t1: T.shield - 0.2, label: '05 / 06   AVADANLIQ', text: 'KİOSK, POS, AĞILLI EKRANLAR.' },
          { t0: T.shield + 0.25, t1: T.dark - 0.2, label: '06 / 06   DƏSTƏK', text: '24/7 DƏSTƏK VƏ TƏHLÜKƏSİZLİK.' },
          { t0: T.dark + 0.35, t1: T.galaxy + 1.3, text: 'HƏR HƏLL BİR HÜCEYRƏDİR.' },
          { t0: T.galaxy + 1.5, t1: T.collapse + 0.2, text: 'BİRLİKDƏ EKOSİSTEM.' },
        ];
      }

      const CAP_Y = 874;
      const LABEL_Y = 812;
      const GLYPHS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZƏÜÖŞÇĞ0123456789/#_';

      function charLayout(str, font, spacing) {
        ctx.font = font;
        ctx.letterSpacing = '0px';
        const chars = [...str];
        const ws = chars.map((ch) => ctx.measureText(ch).width);
        const total = ws.reduce((a, b) => a + b, 0) + spacing * (chars.length - 1);
        return { chars, ws, total };
      }

      /** Trailer title: characters flicker on in random order; tracking slowly widens while held. */
      function drawTitle(str, t0, t1, t, y, size, rgb, seed) {
        if (t < t0 || t > t1 + 0.45) return;
        const life = clamp((t - t0) / Math.max(0.1, t1 - t0));
        let sz = size;
        let spacing = sz * (0.16 + 0.07 * life);
        let L = charLayout(str, `500 ${sz}px Geist`, spacing);
        if (L.total > 1480) {
          sz *= 1480 / L.total;
          spacing = sz * (0.16 + 0.07 * life);
          L = charLayout(str, `500 ${sz}px Geist`, spacing);
        }
        let x = CX - L.total / 2;
        ctx.textBaseline = 'alphabetic';
        L.chars.forEach((ch, j) => {
          const tr = t0 + hash(j * 7.3 + seed) * 0.34;
          const te = t1 + hash(j * 3.1 + seed + 5) * 0.25;
          if (t >= tr && ch !== ' ') {
            const dt = t - tr;
            const fl = dt < 0.1 ? (Math.floor(dt * 60) % 2 ? 0.2 : 1) : 1;
            const q = clamp(dt / 0.2);
            const out = 1 - clamp((t - te) / 0.18);
            const a = fl * (0.3 + 0.7 * q) * out;
            if (a > 0.004) {
              ctx.fillStyle = `rgba(${rgb},${a.toFixed(3)})`;
              ctx.fillText(ch, x, y);
            }
          }
          x += L.ws[j] + spacing;
        });
      }

      /** Mono label that decodes from random glyphs into the real text. */
      function drawDecode(str, t0, t1, t, y, size, rgb, seed, cursor = false) {
        if (t < t0 || t > t1 + 0.3) return;
        const spacing = size * 0.3;
        const font = `400 ${size}px "Geist Mono"`;
        const L = charLayout(str, font, spacing);
        const out = 1 - clamp((t - t1) / 0.25);
        let x = CX - L.total / 2;
        ctx.textBaseline = 'alphabetic';
        const frame = Math.floor(t * 30);
        let lastX = x;
        L.chars.forEach((ch, j) => {
          const ta = t0 + j * 0.012;
          const ts = t0 + 0.12 + j * 0.028 + hash(j + seed) * 0.08;
          if (t >= ta && ch !== ' ') {
            const g = t < ts ? GLYPHS[Math.floor(hash(j * 17 + frame * 3.7 + seed) * GLYPHS.length)] : ch;
            ctx.fillStyle = `rgba(${rgb},${((t < ts ? 0.55 : 1) * out).toFixed(3)})`;
            ctx.fillText(g, x, y);
          }
          if (t >= ta) lastX = x + L.ws[j] + spacing;
          x += L.ws[j] + spacing;
        });
        if (cursor && Math.floor(t * 4) % 2 === 0) {
          ctx.fillStyle = `rgba(${rgb},${out})`;
          ctx.fillRect(lastX + 2, y - size * 0.78, size * 0.55, size * 0.95);
        }
      }

      function drawCaptions(t) {
        ctx.save();
        for (const c of CAPS) {
          if (c.label) {
            drawDecode(c.label, c.t0 - 0.1, c.t1, t, LABEL_Y, 19, '160,160,160', c.t0 * 13);
            if (t > c.t0 - 0.1 && t < c.t1 + 0.3) {
              const q = eoExpo(clamp((t - c.t0 + 0.1) / 0.5)) * (1 - clamp((t - c.t1) / 0.25));
              ctx.fillStyle = `rgba(229,72,77,${0.9 * q})`;
              ctx.fillRect(CX - 14 * q, LABEL_Y + 13, 28 * q, 2);
            }
          }
          drawTitle(c.text, c.t0, c.t1, t, CAP_Y, 38, '238,238,238', c.t0 * 7);
        }
        // Closing line under the name, revealed in two beats.
        const tagA = 'BİZNESİNİZ ÜÇÜN';
        const tagB = 'RƏQƏMSAL EKOSİSTEM.';
        const sz = 24;
        const sp = sz * 0.36;
        const LA = charLayout(tagA, `500 ${sz}px Geist`, sp);
        const LB = charLayout(tagB, `500 ${sz}px Geist`, sp);
        const gap = sp * 3;
        const x0 = CX - (LA.total + gap + LB.total) / 2;
        const yT = 712;
        const tagPart = (L, xs, t0, seed) => {
          let x = xs;
          L.chars.forEach((ch, j) => {
            const tr = t0 + hash(j * 5.7 + seed) * 0.28;
            if (t >= tr && ch !== ' ') {
              const dt = t - tr;
              const fl = dt < 0.1 ? (Math.floor(dt * 60) % 2 ? 0.2 : 1) : 1;
              const a = fl * (0.3 + 0.7 * clamp(dt / 0.25)) * (1 - smooth(DUR - 0.8, DUR - 0.1, t));
              ctx.fillStyle = `rgba(205,205,205,${a.toFixed(3)})`;
              ctx.fillText(ch, x, yT);
            }
            x += L.ws[j] + sp;
          });
        };
        ctx.font = `500 ${sz}px Geist`;
        tagPart(LA, x0, T.tag1, 1);
        tagPart(LB, x0 + LA.total + gap, T.tag2, 2);
        ctx.restore();
      }

      /** Boot line: decodes, fills a progress bar, then collapses like a CRT into the point of light. */
      function drawBoot(t) {
        const t0 = T.boot;
        const tOff = T.point;
        if (t < t0 || t > tOff + 0.02) return;
        const sy = 1 - smooth(tOff - 0.16, tOff - 0.08, t) * 0.985;
        const sx = 1 - smooth(tOff - 0.08, tOff, t) * 0.995;
        ctx.save();
        ctx.setTransform(sx, 0, 0, sy, CX - CX * sx, CY - CY * sy);
        drawDecode('CYBCELL  //  SİSTEM İŞƏ DÜŞÜR', t0, tOff + 1, t, CY + 6, 19, '180,180,180', 3, true);
        const p = eio(smooth(t0 + 0.2, tOff - 0.2, t));
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.fillRect(CX - 170, CY + 34, 340, 1);
        ctx.fillStyle = 'rgba(229,72,77,0.95)';
        ctx.fillRect(CX - 170, CY + 34, 340 * p, 1.5);
        ctx.font = '400 13px "Geist Mono"';
        ctx.letterSpacing = '2px';
        ctx.fillStyle = 'rgba(120,120,120,0.9)';
        ctx.textAlign = 'right';
        ctx.fillText(String(Math.round(p * 100)).padStart(3, '0') + '%', CX + 170, CY + 58);
        ctx.textAlign = 'left';
        ctx.fillText('INIT', CX - 170, CY + 58);
        ctx.letterSpacing = '0px';
        // When squashed, the whole line glows white like a switched-off tube.
        const glowA = smooth(tOff - 0.16, tOff - 0.1, t);
        if (glowA > 0) {
          ctx.fillStyle = `rgba(255,248,240,${glowA})`;
          ctx.fillRect(CX - 360, CY - 14, 720, 60);
        }
        ctx.restore();
      }

      /* ------------------------------------------------------------ render */

      const mkSprite = (w, h, paint) => {
        const c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        paint(c.getContext('2d'), w, h);
        return c;
      };
      const radial = (stops) => (g, w, h) => {
        const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
        for (const [o, c] of stops) gr.addColorStop(o, c);
        g.fillStyle = gr;
        g.fillRect(0, 0, w, h);
      };
      const glow = mkSprite(64, 64, radial([[0, 'rgba(255,255,255,0.9)'], [0.22, 'rgba(255,255,255,0.28)'], [1, 'rgba(255,255,255,0)']]));
      const glowRed = mkSprite(64, 64, radial([[0, 'rgba(255,90,95,0.9)'], [0.25, 'rgba(229,72,77,0.3)'], [1, 'rgba(229,72,77,0)']]));
      const glowEmber = mkSprite(64, 64, radial([[0, 'rgba(255,190,120,0.9)'], [0.25, 'rgba(255,110,40,0.3)'], [1, 'rgba(255,80,20,0)']]));
      // Hit ring: a thin warm ring with a red outer fringe.
      const ringSprite = mkSprite(512, 512, radial([[0, 'rgba(0,0,0,0)'], [0.8, 'rgba(0,0,0,0)'], [0.9, 'rgba(255,214,170,0.55)'], [0.94, 'rgba(255,90,50,0.3)'], [1, 'rgba(255,60,30,0)']]));
      // Anamorphic streak: long horizontal flare.
      const streak = mkSprite(1024, 96, (g, w, h) => {
        const img = g.createImageData(w, h);
        for (let y = 0; y < h; y++)
          for (let x = 0; x < w; x++) {
            const dx = Math.abs(x - w / 2);
            const dy = y - h / 2;
            const core = (Math.exp(-dx / 150) + 0.5 * Math.exp(-dx / 30)) * Math.exp(-(dy * dy) / 6);
            const halo = Math.exp(-dx / 260) * Math.exp(-(dy * dy) / 220) * 0.35;
            const v = Math.min(1, core + halo);
            const hw = halo / (core + halo + 1e-6);
            const k = (y * w + x) * 4;
            img.data[k] = 255;
            img.data[k + 1] = 225 - 60 * hw;
            img.data[k + 2] = 200 - 110 * hw;
            img.data[k + 3] = v * 255;
          }
        g.putImageData(img, 0, 0);
      });

      const bg = mkSprite(W, H, (g) => {
        const gr = g.createRadialGradient(CX, 500, 0, CX, 500, 1150);
        gr.addColorStop(0, '#0c0c0d');
        gr.addColorStop(0.5, '#060606');
        gr.addColorStop(1, '#010101');
        g.fillStyle = gr;
        g.fillRect(0, 0, W, H);
      });
      const vig = mkSprite(W, H, (g) => {
        const gr = g.createRadialGradient(CX, 540, 380, CX, 540, 1200);
        gr.addColorStop(0, 'rgba(0,0,0,0)');
        gr.addColorStop(1, 'rgba(0,0,0,0.78)');
        g.fillStyle = gr;
        g.fillRect(0, 0, W, H);
      });
      // Film grain: a few noise tiles around mid-grey, blended with overlay.
      const GRAIN = [0, 1, 2, 3].map((k) =>
        mkSprite(960, 540, (g, w, h) => {
          const img = g.createImageData(w, h);
          let s = 1000 + k * 7919;
          for (let p = 0; p < w * h; p++) {
            s = (s * 16807) % 2147483647;
            const u = s / 2147483647;
            s = (s * 16807) % 2147483647;
            const v = s / 2147483647;
            const n = 128 + (u + v - 1) * 70;
            img.data[p * 4] = img.data[p * 4 + 1] = img.data[p * 4 + 2] = n;
            img.data[p * 4 + 3] = 255;
          }
          g.putImageData(img, 0, 0);
        }),
      );

      // Colour of a particle from heat h and brightness a: white -> ember.
      const PAL = [];
      for (let hq = 0; hq <= 12; hq++) {
        const row = [];
        for (let bq = 0; bq < 4; bq++) {
          const h = hq / 12;
          const b = (bq + 0.5) / 4;
          const e = b < 0.5 ? [lerp(170, 255, b * 2), lerp(38, 105, b * 2), lerp(22, 40, b * 2)] : [255, lerp(105, 215, b * 2 - 1), lerp(40, 165, b * 2 - 1)];
          row.push(`rgb(${Math.round(lerp(255, e[0], h))},${Math.round(lerp(255, e[1], h))},${Math.round(lerp(255, e[2], h))})`);
        }
        PAL.push(row);
      }

      const mk = () => {
        const c = document.createElement('canvas');
        c.width = W;
        c.height = H;
        return [c, c.getContext('2d')];
      };
      const [layer, lx] = mk();
      const [tint, tx] = mk();
      const small = document.createElement('canvas');
      small.width = W / 4;
      small.height = H / 4;
      const sx = small.getContext('2d');

      function camera(t, k) {
        const seg = SEG[k];
        const t1 = k + 1 < SEG.length ? SEG[k + 1].t0 : DUR;
        const p = clamp((t - seg.t0) / (t1 - seg.t0));
        const prevZoom = k > 0 ? SEG[k - 1].zoom || 1 : 1;
        const zoom = lerp(prevZoom, seg.zoom || 1, eio(clamp((t - seg.t0) / (seg.blend || 1))));
        let scale = BASE * zoom * (1 + 0.05 * eio(p));
        let ox = 0;
        let oy = 0;
        for (const [th, kk] of T.hits) {
          const dt = t - th;
          if (dt >= 0 && dt < 1.5) {
            scale *= 1 + kk * 0.06 * Math.exp(-dt / 0.28);
            const amp = kk * 16 * Math.exp(-dt / 0.2);
            ox += amp * (0.6 * Math.sin(t * 91.7 + th) + 0.4 * Math.sin(t * 53.3 + th * 3));
            oy += amp * (0.6 * Math.sin(t * 77.1 + th * 2) + 0.4 * Math.sin(t * 41.9 + th * 5));
          } else if (dt < 0 && dt > -0.7 && kk >= 0.75) scale *= 1 + 0.035 * Math.pow(1 + dt / 0.7, 2);
        }
        return { scale, ox, oy };
      }

      function hitFx(t) {
        let flash = 0;
        let ca = 0;
        let flare = 0;
        let ring = -1;
        for (const [th, kk] of T.hits) {
          const dt = t - th;
          if (dt < 0 || dt > 2.5) continue;
          const big = kk >= 0.95;
          flash = Math.max(flash, (big ? 0.95 : kk >= 0.75 ? 0.7 : kk * 0.45) * Math.exp(-dt / (big ? 0.09 : 0.06)));
          ca = Math.max(ca, kk * 14 * Math.exp(-dt / 0.22));
          flare = Math.max(flare, kk * Math.exp(-dt / (big ? 0.6 : 0.3)));
          if (big && dt < 0.9) ring = dt;
        }
        // Steady flares: the point of light, the burning cell, the name.
        const point = t < T.hit ? smooth(T.point, T.hit, t) : 0;
        const ember = smooth(T.hit, T.hit + 0.3, t) * (1 - smooth(T.div[0], T.div[0] + 1.2, t));
        const body = smooth(T.hit, T.hit + 0.45, t) * (1 - smooth(T.div[0] - 0.05, T.div[0] + 0.3, t));
        const logo = smooth(T.logo, T.logo + 0.3, t) * 0.12 * (1 - smooth(T.logo + 1.2, T.logo + 2.4, t));
        const star = t > T.collapse + 0.2 && t < T.logo ? smooth(T.collapse + 0.2, T.logo - 0.1, t) * 0.6 : 0;
        flare = Math.max(flare, point * 0.55, ember * 0.3, logo, star);
        return { flash, ca, flare, ring, ember, body };
      }

      let frameNo = 0;
      function draw(t) {
        const k = compose(t);
        const cam = camera(t, k);
        const fx = hitFx(t);
        const ox = CX + cam.ox;
        const oy = CY + cam.oy;

        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1;
        ctx.filter = 'none';
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.drawImage(bg, 0, 0);

        // The burning cell lights the space around it.
        if (fx.ember > 0.01) {
          const r = EMBER_R * cam.scale * 2.9;
          const gr = ctx.createRadialGradient(ox, oy, EMBER_R * cam.scale * 0.6, ox, oy, r);
          gr.addColorStop(0, `rgba(255,96,32,${0.3 * fx.ember})`);
          gr.addColorStop(0.35, `rgba(200,50,20,${0.12 * fx.ember})`);
          gr.addColorStop(1, 'rgba(120,20,10,0)');
          ctx.fillStyle = gr;
          ctx.fillRect(0, 0, W, H);
        }
        if (fx.body > 0.01) {
          const r = EMBER_R * cam.scale * eoExpo(clamp((t - T.hit) / 0.5)) * 1.01;
          const gr = ctx.createRadialGradient(ox - r * 0.28, oy - r * 0.3, 0, ox, oy, r);
          gr.addColorStop(0, `rgba(255,196,120,${0.62 * fx.body})`);
          gr.addColorStop(0.55, `rgba(240,108,42,${0.4 * fx.body})`);
          gr.addColorStop(0.92, `rgba(165,42,18,${0.3 * fx.body})`);
          gr.addColorStop(1, 'rgba(110,20,8,0)');
          ctx.fillStyle = gr;
          ctx.beginPath();
          ctx.arc(ox, oy, r, 0, TAU);
          ctx.fill();
        }

        // Particles on their own layer so the bloom only picks them up.
        lx.setTransform(1, 0, 0, 1, 0, 0);
        lx.clearRect(0, 0, W, H);
        lx.setTransform(cam.scale, 0, 0, cam.scale, ox - CX * cam.scale, oy - CY * cam.scale);
        lx.lineWidth = 1;
        lx.lineCap = 'round';
        let last = '';
        for (let i = 0; i < N; i++) {
          const a = OUT.a[i];
          if (a < 0.01) continue;
          const x = OUT.x[i];
          const y = OUT.y[i];
          const s = OUT.s[i];
          const h = OUT.h[i];
          const style = OUT.c[i] === 1 ? '#ff5a5f' : h < 0.04 ? '#fff' : PAL[Math.min(12, Math.round(h * 12))][Math.min(3, (a * 4) | 0)];
          if (style !== last) {
            lx.fillStyle = style;
            lx.strokeStyle = style;
            last = style;
          }
          lx.globalAlpha = a > 1 ? 1 : a;
          lx.fillRect(x - s / 2, y - s / 2, s, s);
          const vx = STREAK[i * 2];
          const vy = STREAK[i * 2 + 1];
          if (vx * vx + vy * vy > 9) {
            lx.globalAlpha = Math.min(1, a) * 0.35;
            lx.beginPath();
            lx.moveTo(x, y);
            lx.lineTo(x - vx, y - vy);
            lx.stroke();
          }
        }
        lx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < N; i++) {
          const a = OUT.a[i];
          if (a < 0.72 || OUT.s[i] < 1.6) continue;
          const g = 10 + OUT.s[i] * 5;
          lx.globalAlpha = Math.min(1, a) * 0.32;
          lx.drawImage(OUT.c[i] === 1 ? glowRed : OUT.h[i] > 0.5 ? glowEmber : glow, OUT.x[i] - g / 2, OUT.y[i] - g / 2, g, g);
        }
        lx.globalCompositeOperation = 'source-over';
        lx.globalAlpha = 1;
        lx.setTransform(1, 0, 0, 1, 0, 0);

        ctx.drawImage(layer, 0, 0);

        // Chromatic split on impacts: warm-tinted copies offset left and right.
        if (fx.ca > 0.8) {
          for (const [col, dx, al] of [['rgb(255,50,30)', -fx.ca, 0.55], ['rgb(255,190,90)', fx.ca, 0.35]]) {
            tx.globalCompositeOperation = 'source-over';
            tx.clearRect(0, 0, W, H);
            tx.drawImage(layer, 0, 0);
            tx.globalCompositeOperation = 'source-in';
            tx.fillStyle = col;
            tx.fillRect(0, 0, W, H);
            ctx.globalCompositeOperation = 'lighter';
            ctx.globalAlpha = al;
            ctx.drawImage(tint, dx, 0);
          }
          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = 'source-over';
        }

        // Bloom: a blurred, downscaled copy added on top.
        sx.clearRect(0, 0, W / 4, H / 4);
        sx.filter = 'blur(5px)';
        sx.drawImage(layer, 0, 0, W / 4, H / 4);
        sx.filter = 'none';
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = Math.min(1, 0.85 + fx.flare * 0.5);
        ctx.drawImage(small, 0, 0, W, H);

        // Lens: anamorphic streak and a ring on the biggest hits.
        if (fx.flare > 0.01) {
          ctx.globalAlpha = Math.min(1, fx.flare);
          const sw = 1400 + fx.flare * 1400;
          ctx.drawImage(streak, ox - sw / 2, oy - 40, sw, 80);
          ctx.globalAlpha = Math.min(1, fx.flare) * 0.5;
          ctx.drawImage(streak, ox - sw * 0.35, oy - 14, sw * 0.7, 28);
        }
        if (fx.ring >= 0) {
          const q = fx.ring / 0.9;
          const r = 80 + 1100 * eoExpo(q);
          ctx.globalAlpha = (1 - q) * 0.7;
          ctx.drawImage(ringSprite, ox - r, oy - r, r * 2, r * 2);
        }
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';

        drawBoot(t);
        drawCaptions(t);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.filter = 'none';
        ctx.drawImage(vig, 0, 0);

        // Grain.
        ctx.globalCompositeOperation = 'overlay';
        ctx.globalAlpha = 0.45;
        ctx.drawImage(GRAIN[frameNo++ % 4], 0, 0, W, H);
        ctx.globalCompositeOperation = 'source-over';

        // Silence before a hit: the picture holds its breath too.
        let dim = 0;
        for (const [a, b] of T.silence) if (t >= a && t < b && a > 3) dim = 0.45;
        // Impact flash.
        if (fx.flash > 0.004) {
          ctx.globalAlpha = fx.flash;
          ctx.fillStyle = '#fff6ec';
          ctx.fillRect(0, 0, W, H);
        }
        const fade = Math.max(dim, smooth(DUR - 0.8, DUR, t));
        if (fade > 0) {
          ctx.globalAlpha = fade;
          ctx.fillStyle = '#000';
          ctx.fillRect(0, 0, W, H);
        }
        ctx.globalAlpha = 1;
        // Letterbox.
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, BAR);
        ctx.fillRect(0, H - BAR, W, BAR);
      }

      async function init() {
        T = await (await fetch('timeline.json')).json();
        DUR = T.duration;
        window.DURATION = DUR;
        for (let k = 0; k < 20; k++) {
          try {
            await Promise.all([document.fonts.load('500 38px Geist'), document.fonts.load('600 100px Geist'), document.fonts.load('400 17px "Geist Mono"')]);
            break;
          } catch {
            await new Promise((r) => setTimeout(r, 100));
          }
        }
        buildWeb();
        buildApp();
        buildTower();
        buildChart();
        buildKiosk();
        buildShield();
        buildWord();
        buildTimeline();
        buildCaptions();
      }

      const params = new URLSearchParams(location.search);
      window.ready = init().then(() => true);
      window.seek = async (t) => {
        await window.ready;
        frameNo = Math.round(t * 60);
        draw(t);
        return true;
      };
      if (params.has('render')) document.body.classList.add('render');
      else
        window.ready.then(() => {
          const start = performance.now() - (Number(params.get('t')) || 0) * 1000;
          const loop = (now) => {
            draw(((now - start) / 1000) % DUR);
            requestAnimationFrame(loop);
          };
          requestAnimationFrame(loop);
        });
    </script>
  </body>
</html>
